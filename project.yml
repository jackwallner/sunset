name: Sunset
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  Sunset:
    build:
      targets:
        Sunset: all
        SunsetTests: [test]
    test:
      targets:
        - SunsetTests
      config: Debug
      storeKitConfiguration: Sunset.storekit
    run:
      config: Debug
      storeKitConfiguration: Sunset.storekit

targets:
  Sunset:
    type: application
    platform: iOS
    sources:
      - path: Sunset
      - path: Shared
      - path: Sunset.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.sunset
        PRODUCT_NAME: Sunset
        INFOPLIST_FILE: Sunset/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sunset/Sunset.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: SunsetWidget

  SunsetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SunsetWidget
      - path: Shared/Models
      - path: Shared/Utilities
      - path: Shared/Services/ForecastService.swift
      - path: Shared/Services/ForecastCache.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.sunset.widget
        INFOPLIST_FILE: SunsetWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SunsetWidget/SunsetWidget.entitlements

  SunsetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SunsetTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.sunset.tests
    dependencies:
      - target: Sunset
